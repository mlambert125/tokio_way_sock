[package]
name = "tokio_way_sock"
version = "0.1.0"
edition = "2024"
description = "A Tokio-Based Wayland Unix Socket Listener"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tokio", "wayland", "compositor", "socket", "unix"]
categories = ["network-programming", "os::unix-apis"]
homepage = "https://github.com/mlambert125/tokio_way_sock"
repository = "https://github.com/mlambert125/tokio_way_sock"

[dependencies]
anyhow = "1.0.100"
libc = "0.2.186"
sendfd = { version = "0.4.4", features = ["tokio"] }
tracing = { version = "0.1.41" }
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7.18"
